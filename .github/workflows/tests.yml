name: RAG checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RAG_MODE: local

jobs:
  unit-tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install and check dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Run unit and API tests
        run: python -m unittest discover -s tests -v

  browser-smoke:
    name: Chromium browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAG_BASE_URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-browser.txt
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-browser.txt
          python -m pip check
          python -m playwright install --with-deps chromium
      - name: Run browser checks against the live application
        shell: bash
        env:
          RAG_BROWSER_OUTPUT: ${{ runner.temp }}/rag-verification
        run: |
          mkdir -p "$RAG_BROWSER_OUTPUT"
          python run_rag.py --port 8765 > "$RAG_BROWSER_OUTPUT/server.log" 2>&1 &
          rag_server_pid=$!
          trap 'kill "$rag_server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent "$RAG_BASE_URL/health" > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$rag_server_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RAG_BROWSER_OUTPUT/server.log"
            exit 1
          fi
          python tests/browser_smoke.py 2>&1 | tee "$RAG_BROWSER_OUTPUT/browser.log"
      - name: Save browser screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rag-browser-verification
          path: ${{ runner.temp }}/rag-verification/
          if-no-files-found: ignore
          retention-days: 7
